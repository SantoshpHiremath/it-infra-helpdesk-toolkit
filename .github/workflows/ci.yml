name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t it-infra-helpdesk-toolkit:ci .

      - name: Run container and smoke-test health endpoint
        run: |
          docker run -d --name helpdesk-ci -p 8000:8000 it-infra-helpdesk-toolkit:ci
          sleep 5
          curl -f http://localhost:8000/healthz
          docker stop helpdesk-ci
